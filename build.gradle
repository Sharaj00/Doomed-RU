plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '2.0.0'
group = 'local.doomed.russianfresh'
base { archivesName = 'DoomedRU' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { doomed_ru_fresh { source sourceSets.main } }
            args '--username', 'TranslationAudit'
            if (project.hasProperty('auditClient')) {
                property 'doomed.ru.audit', 'true'
                args '--width', '1280', '--height', '800'
            }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
jar {
    manifest { attributes 'MixinConfigs': 'doomed_ru_fresh.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
